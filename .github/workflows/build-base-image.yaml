name: Build test-db base image

on:
  workflow_dispatch:
  push:
    branches: ["feat/test-db-base-image"]
    paths:
      - "Dockerfile"
      - ".github/workflows/build-base-image.yaml"

jobs:
  build:
    name: Build & push to ECR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repo exists
        run: |
          aws ecr describe-repositories --repository-names test-db-base \
            || aws ecr create-repository --repository-name test-db-base

      - name: Build and push to ECR
        env:
          ECR: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ECR/test-db-base:pg16-fw8" -t "$ECR/test-db-base:latest" .
          docker push "$ECR/test-db-base:pg16-fw8"
          docker push "$ECR/test-db-base:latest"
          echo "Pushed: $ECR/test-db-base:pg16-fw8"
