name: "Set up test db"
description: "Set up test db"
inputs:
  db_user:
    description: DB user
    required: false
    default: admin
  db_password:
    description: DB password
    required: false
    default: admin
  db_name:
    description: DB user
    required: false
    default: all_services_test
  db_port:
    description: DB port
    required: false
    default: "5432"
  db_extensions:
    description: DB extensions list separated by a space
    required: false
    default: uuid-ossp vector pg_trgm fuzzystrmatch
  db_schemas:
    description: DB schemas list to create separated by a space
    required: false
  db_migrations_path:
    description: Db migrations path
    required: false
    default: db/migrations
  db_migrations_config_path:
    description: Db migrations config path
    required: false
    default: db/test/conf/flyway.conf
  github_token:
    description: Github token
    required: false
  migrate_chat:
    description: Migrate chat service
    required: false
    default: "false"
  migrate_employee:
    description: Migrate employee service
    required: false
    default: "false"
  migrate_case:
    description: Migrate case service
    required: false
    default: "false"
  migrate_dashboard:
    description: Migrate dashboard service
    required: false
    default: "false"
  migrate_notification:
    description: Migrate dashboard service
    required: false
    default: "false"
  migrate_scheduler:
    description: Migrate dashboard service
    required: false
    default: "false"
  migrate_ticket:
    description: Migrate dashboard service
    required: false
    default: "false"
  migrate_file:
    description: Migrate file service
    required: false
    default: "false"
  migrate_self:
    description: Migrate the service itself
    required: false
    default: "true"
  migrate_self_before:
    description: Migrate the service itself before (chat, employee, case, dashboard, last)
    required: false
    default: "last"
  aws_access_key_id:
    description: AWS Key ID (para pullear la imagen base de ECR). Requerido en v2.
    required: true
  aws_secret_access_key:
    description: AWS Secret Access Key. Requerido en v2.
    required: true
  aws_region:
    description: AWS region del ECR
    required: false
    default: us-east-1
  base_image_name:
    description: Nombre:tag de la imagen base en ECR
    required: false
    default: "test-db-base:pg16-fw8"

runs:
  using: "composite"
 
  steps:
      # v2: postgres SIEMPRE desde la imagen base pre-horneada en ECR (pgvector+flyway+psql).
      # Autentica a ECR acá adentro con las AWS creds que pasa el consumidor (así no necesita
      # correr amazon-ecr-login ni pasar base_image). Corre postgres con docker run, crea las
      # extensions, y deja shims de flyway/psql (docker exec al container) para que los steps de
      # schemas/migraciones de abajo no cambien.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Postgres from base image
        shell: bash
        env:
          BASE_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.base_image_name }}
          DB_USER: ${{ inputs.db_user }}
          DB_PASSWORD: ${{ inputs.db_password }}
          DB_NAME: ${{ inputs.db_name }}
          DB_PORT: ${{ inputs.db_port }}
          DB_EXTENSIONS: ${{ inputs.db_extensions }}
        run: |
          set -euo pipefail
          docker run -d --name lara-testdb \
            -e POSTGRES_USER="$DB_USER" \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" \
            -e POSTGRES_DB="$DB_NAME" \
            -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" \
            -p "$DB_PORT":5432 \
            "$BASE_IMAGE"

          # Esperamos a que la DB responda una query REAL por TCP. Ojo: el entrypoint
          # de postgres arranca un server temporal socket-only durante el initdb, y
          # `pg_isready` (o cualquier query por socket) da "listo" ahí, ANTES de que
          # exista POSTGRES_DB -> race que hacía fallar los steps siguientes con
          # 'database "..." does not exist'. El server temporal NO escucha TCP, así
          # que un SELECT vía -h 127.0.0.1 solo pasa con el server real ya inicializado.
          echo "Esperando postgres..."
          ready=""
          for i in $(seq 1 60); do
            if docker exec lara-testdb psql -U "$DB_USER" -h 127.0.0.1 -d "$DB_NAME" -c 'SELECT 1' >/dev/null 2>&1; then
              echo "postgres listo"; ready=1; break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::postgres/$DB_NAME no quedó listo tras 60s"
            docker logs lara-testdb || true
            exit 1
          fi

          # Extensions (postgresql-action las crea en modo default; acá lo hacemos a mano)
          for ext in $DB_EXTENSIONS; do
            docker exec lara-testdb psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
              -c "CREATE EXTENSION IF NOT EXISTS \"$ext\";"
          done

          # Shims: flyway/psql del PATH -> docker exec al container, con cwd = workspace
          # (montado en la misma ruta) para que los paths relativos de los steps resuelvan igual.
          # Se usan printf (no heredoc) para no arrastrar la indentación del YAML al script.
          printf '%s\n' '#!/usr/bin/env bash' "exec docker exec -w \"$GITHUB_WORKSPACE\" lara-testdb flyway \"\$@\"" | sudo tee /usr/local/bin/flyway >/dev/null
          printf '%s\n' '#!/usr/bin/env bash' "exec docker exec -e PGPASSWORD=\"$DB_PASSWORD\" -w \"$GITHUB_WORKSPACE\" lara-testdb psql \"\$@\"" | sudo tee /usr/local/bin/psql >/dev/null
          sudo chmod +x /usr/local/bin/flyway /usr/local/bin/psql

      - name: Create schemas
        shell: bash
        id: create-schemas
        if: inputs.db_schemas != ''
        env:
          DB_SCHEMAS: ${{ inputs.db_schemas }}
          DB_USER: ${{ inputs.db_user }}
          DB_PASSWORD: ${{ inputs.db_password }}
          DB_PORT: ${{ inputs.db_port }}
          DB_NAME: ${{ inputs.db_name }}
        run: |
          IFS=' ' read -r -a schemas <<< "$DB_SCHEMAS"
          connection_string="postgres://$DB_USER:$DB_PASSWORD@localhost:$DB_PORT/$DB_NAME"
          for schema in "${schemas[@]}"
          do
            psql -d $connection_string -c "CREATE SCHEMA IF NOT EXISTS $schema;"
          done

      # (v2 no instala flyway en el runner: viene del shim que apunta al container)

      - name: Make migrations before clerk
        shell: bash
        id: make-migrations-before-clerk
        if: inputs.migrate_self == 'true' && inputs.migrate_self_before == 'clerk'
        env:
          DB_PORT: ${{ inputs.db_port }}
          DB_NAME: ${{ inputs.db_name }}
          DB_USER: ${{ inputs.db_user }}
          DB_PASSWORD: ${{ inputs.db_password }}
          DB_MIGRATIONS_PATH: ${{ inputs.db_migrations_path }}
          DB_MIGRATIONS_CONFIG_PATH: ${{ inputs.db_migrations_config_path }}
        run: |
          flyway migrate -url=jdbc:postgresql://localhost:$DB_PORT/$DB_NAME \
            -user=$DB_USER \
            -password=$DB_PASSWORD \
            -locations=$DB_MIGRATIONS_PATH \
            -configFiles=$DB_MIGRATIONS_CONFIG_PATH

      # Migrate clerk service
      - name: Copy migrations from clerk-service
        uses: actions/checkout@v3
        if: inputs.migrate_clerk == 'true'
        with:
          repository: 'meetlara/clerk-service'
          ref: 'main'
          token: ${{ inputs.github_token }} 
          path: clerk-service
      - name: Make clerk migrations
        shell: bash
        id: make-clerk-migrations
        if: inputs.migrate_clerk == 'true'
        env:
          DB_PORT: ${{ inputs.db_port }}
          DB_NAME: ${{ inputs.db_name }}
          DB_MIGRATIONS_PATH: ${{ inputs.db_migrations_path }}
          DB_MIGRATIONS_CONFIG_PATH: ${{ inputs.db_migrations_config_path }}
        run: |
          flyway migrate -url=jdbc:postgresql://localhost:$DB_PORT/$DB_NAME \
            -user=admin \
            -password=admin \
            -locations=clerk-service/$DB_MIGRATIONS_PATH \
            -configFiles=clerk-service/$DB_MIGRATIONS_CONFIG_PATH

      - name: Make migrations before chat
        shell: bash
        id: make-migrations-before-chat
        if: inputs.migrate_self == 'true' && inputs.migrate_self_before == 'chat'
        env:
          DB_PORT: ${{ inputs.db_port }}
          DB_NAME: ${{ inputs.db_name }}
          DB_USER: ${{ inputs.db_user }}
          DB_PASSWORD: ${{ inputs.db_password }}
          DB_MIGRATIONS_PATH: ${{ inputs.db_migrations_path }}
          DB_MIGRATIONS_CONFIG_PATH: ${{ inputs.db_migrations_config_path }}
        run: |
          flyway migrate -url=jdbc:postgresql://localhost:$DB_PORT/$DB_NAME \
            -user=$DB_USER \
            -password=$DB_PASSWORD \
            -locations=$DB_MIGRATIONS_PATH \
            -configFiles=$DB_MIGRATIONS_CONFIG_PATH
            
      # Migrate chat service
      - name: Copy migrations from chat
        uses: actions/checkout@v3
        if: inputs.migrate_chat == 'true'
        with:
          repository: 'meetlara/chat-service'
          ref: 'main'
          token: ${{ inputs.github_token }} 
          path: chat-service
      - name: Make chat migrations
        shell: bash
        id: make-chat-migrations
        if: inputs.migrate_chat == 'true'
        env:
          DB_PORT: ${{ inputs.db_port }}
          DB_NAME: ${{ inputs.db_name }}
          DB_MIGRATIONS_PATH: ${{ inputs.db_migrations_path }}
          DB_MIGRATIONS_CONFIG_PATH: ${{ inputs.db_migrations_config_path }}
        run: |
          flyway migrate -url=jdbc:postgresql://localhost:$DB_PORT/$DB_NAME \
            -user=admin \
            -password=admin \
            -locations=chat-service/$DB_MIGRATIONS_PATH \
            -configFiles=chat-service/$DB_MIGRATIONS_CONFIG_PATH

      - name: Make migrations before employee
        shell: bash
        id: make-migrations-before-employee
        if: inputs.migrate_self == 'true' && inputs.migrate_self_before == 'employee'
        env:
          DB_PORT: ${{ inputs.db_port }}
          DB_NAME: ${{ inputs.db_name }}
          DB_USER: ${{ inputs.db_user }}
          DB_PASSWORD: ${{ inputs.db_password }}
          DB_MIGRATIONS_PATH: ${{ inputs.db_migrations_path }}
          DB_MIGRATIONS_CONFIG_PATH: ${{ inputs.db_migrations_config_path }}
        run: |
          flyway migrate -url=jdbc:postgresql://localhost:$DB_PORT/$DB_NAME \
            -user=$DB_USER \
            -password=$DB_PASSWORD \
            -locations=$DB_MIGRATIONS_PATH \
            -configFiles=$DB_MIGRATIONS_CONFIG_PATH

      # Migrate employee service
      - name: Copy migrations from employee-service
        uses: actions/checkout@v3
        if: inputs.migrate_employee == 'true'
        with:
          repository: 'meetlara/employee-service'
          ref: 'main'
          token: ${{ inputs.github_token }} 
          path: employee-service
      - name: Make employee migrations
        shell: bash
        id: make-employee-migrations
        if: inputs.migrate_employee == 'true'
        env:
          DB_PORT: ${{ inputs.db_port }}
          DB_NAME: ${{ inputs.db_name }}
          DB_MIGRATIONS_PATH: ${{ inputs.db_migrations_path }}
          DB_MIGRATIONS_CONFIG_PATH: ${{ inputs.db_migrations_config_path }}
        run: |
          flyway migrate -url=jdbc:postgresql://localhost:$DB_PORT/$DB_NAME \
            -user=admin \
            -password=admin \
            -locations=employee-service/$DB_MIGRATIONS_PATH \
            -configFiles=employee-service/$DB_MIGRATIONS_CONFIG_PATH

      - name: Make migrations before case
        shell: bash
        id: make-migrations-before-case
        if: inputs.migrate_self == 'true' && inputs.migrate_self_before == 'case'
        env:
          DB_PORT: ${{ inputs.db_port }}
          DB_NAME: ${{ inputs.db_name }}
          DB_USER: ${{ inputs.db_user }}
          DB_PASSWORD: ${{ inputs.db_password }}
          DB_MIGRATIONS_PATH: ${{ inputs.db_migrations_path }}
          DB_MIGRATIONS_CONFIG_PATH: ${{ inputs.db_migrations_config_path }}
        run: |
          flyway migrate -url=jdbc:postgresql://localhost:$DB_PORT/$DB_NAME \
            -user=$DB_USER \
            -password=$DB_PASSWORD \
            -locations=$DB_MIGRATIONS_PATH \
            -configFiles=$DB_MIGRATIONS_CONFIG_PATH

      # Migrate case service
      - name: Copy migrations from cases
        uses: actions/checkout@v3
        if: inputs.migrate_case == 'true'
        with:
          repository: 'meetlara/case-service'
          ref: 'main'
          token: ${{ inputs.github_token }} 
          path: case-service
      - name: Make case migrations
        shell: bash
        id: make-case-migrations
        if: inputs.migrate_case == 'true'
        env:
          DB_PORT: ${{ inputs.db_port }}
          DB_NAME: ${{ inputs.db_name }}
          DB_MIGRATIONS_PATH: ${{ inputs.db_migrations_path }}
          DB_MIGRATIONS_CONFIG_PATH: ${{ inputs.db_migrations_config_path }}
        run: |
          flyway migrate -url=jdbc:postgresql://localhost:$DB_PORT/$DB_NAME \
            -user=admin \
            -password=admin \
            -locations=case-service/$DB_MIGRATIONS_PATH \
            -configFiles=case-service/$DB_MIGRATIONS_CONFIG_PATH

       # Migrate tickets service
      - name: Copy migrations from tickets
        uses: actions/checkout@v3
        if: inputs.migrate_ticket == 'true'
        with:
          repository: 'meetlara/ticket-service'
          ref: 'main'
          token: ${{ inputs.github_token }} 
          path: ticket-service
      - name: Make ticket migrations
        shell: bash
        id: make-ticket-migrations
        if: inputs.migrate_ticket == 'true'
        env:
          DB_PORT: ${{ inputs.db_port }}
          DB_NAME: ${{ inputs.db_name }}
          DB_MIGRATIONS_PATH: ${{ inputs.db_migrations_path }}
          DB_MIGRATIONS_CONFIG_PATH: ${{ inputs.db_migrations_config_path }}
        run: |
          flyway migrate -url=jdbc:postgresql://localhost:$DB_PORT/$DB_NAME \
            -user=admin \
            -password=admin \
            -locations=ticket-service/$DB_MIGRATIONS_PATH \
            -configFiles=ticket-service/$DB_MIGRATIONS_CONFIG_PATH
      
      # Migrate file service
      - name: Copy migrations from file
        uses: actions/checkout@v3
        if: inputs.migrate_file == 'true'
        with:
          repository: "meetlara/file-employee-integration-service"
          ref: "main"
          token: ${{ inputs.github_token }}
          path: file-employee-integration-service
      - name: Make file migrations
        shell: bash
        id: make-file-migrations
        if: inputs.migrate_file == 'true'
        env:
          DB_PORT: ${{ inputs.db_port }}
          DB_NAME: ${{ inputs.db_name }}
          DB_MIGRATIONS_PATH: ${{ inputs.db_migrations_path }}
          DB_MIGRATIONS_CONFIG_PATH: ${{ inputs.db_migrations_config_path }}
        run: |
          flyway migrate -url=jdbc:postgresql://localhost:$DB_PORT/$DB_NAME \
            -user=admin \
            -password=admin \
            -locations=file-employee-integration-service/$DB_MIGRATIONS_PATH \
            -configFiles=file-employee-integration-service/$DB_MIGRATIONS_CONFIG_PATH
     
      # Migrate scheduler service
      - name: Copy migrations from scheduler
        uses: actions/checkout@v3
        if: inputs.migrate_scheduler == 'true'
        with:
          repository: 'meetlara/scheduler-service'
          ref: 'main'
          token: ${{ inputs.github_token }} 
          path: scheduler-service
      - name: Make scheduler migrations
        shell: bash
        id: make-scheduler-migrations
        if: inputs.migrate_scheduler == 'true'
        env:
          DB_PORT: ${{ inputs.db_port }}
          DB_NAME: ${{ inputs.db_name }}
          DB_MIGRATIONS_PATH: ${{ inputs.db_migrations_path }}
          DB_MIGRATIONS_CONFIG_PATH: ${{ inputs.db_migrations_config_path }}
        run: |
          flyway migrate -url=jdbc:postgresql://localhost:$DB_PORT/$DB_NAME \
            -user=admin \
            -password=admin \
            -locations=scheduler-service/$DB_MIGRATIONS_PATH \
            -configFiles=scheduler-service/$DB_MIGRATIONS_CONFIG_PATH

       # Migrate notification service
      - name: Copy migrations from notification
        uses: actions/checkout@v3
        if: inputs.migrate_notification == 'true'
        with:
          repository: 'meetlara/notification-service'
          ref: 'main'
          token: ${{ inputs.github_token }} 
          path: notification-service
      - name: Make notification migrations
        shell: bash
        id: make-notification-migrations
        if: inputs.migrate_notification == 'true'
        env:
          DB_PORT: ${{ inputs.db_port }}
          DB_NAME: ${{ inputs.db_name }}
          DB_MIGRATIONS_PATH: ${{ inputs.db_migrations_path }}
          DB_MIGRATIONS_CONFIG_PATH: ${{ inputs.db_migrations_config_path }}
        run: |
          flyway migrate -url=jdbc:postgresql://localhost:$DB_PORT/$DB_NAME \
            -user=admin \
            -password=admin \
            -locations=notification-service/$DB_MIGRATIONS_PATH \
            -configFiles=notification-service/$DB_MIGRATIONS_CONFIG_PATH 


      - name: Make migrations before dashboard
        shell: bash
        id: make-migrations-before-dashboard
        if: inputs.migrate_self == 'true' && inputs.migrate_self_before == 'dashboard'
        env:
          DB_PORT: ${{ inputs.db_port }}
          DB_NAME: ${{ inputs.db_name }}
          DB_USER: ${{ inputs.db_user }}
          DB_PASSWORD: ${{ inputs.db_password }}
          DB_MIGRATIONS_PATH: ${{ inputs.db_migrations_path }}
          DB_MIGRATIONS_CONFIG_PATH: ${{ inputs.db_migrations_config_path }}
        run: |
          flyway migrate -url=jdbc:postgresql://localhost:$DB_PORT/$DB_NAME \
            -user=$DB_USER \
            -password=$DB_PASSWORD \
            -locations=$DB_MIGRATIONS_PATH \
            -configFiles=$DB_MIGRATIONS_CONFIG_PATH

      # Migrate dashboard service
      - name: Copy migrations from dashboard
        uses: actions/checkout@v3
        if: inputs.migrate_dashboard == 'true'
        with:
          repository: 'meetlara/dashboard-service'
          ref: 'main'
          token: ${{ inputs.github_token }} 
          path: dashboard-service
      - name: Make dashboard migrations
        shell: bash
        id: make-dashboard-migrations
        if: inputs.migrate_dashboard == 'true'
        env:
          DB_PORT: ${{ inputs.db_port }}
          DB_NAME: ${{ inputs.db_name }}
          DB_MIGRATIONS_PATH: ${{ inputs.db_migrations_path }}
          DB_MIGRATIONS_CONFIG_PATH: ${{ inputs.db_migrations_config_path }}
        run: |
          flyway migrate -url=jdbc:postgresql://localhost:$DB_PORT/$DB_NAME \
            -user=admin \
            -password=admin \
            -locations=dashboard-service/$DB_MIGRATIONS_PATH \
            -configFiles=dashboard-service/$DB_MIGRATIONS_CONFIG_PATH

      # Migrate the service itself
      - name: Make migrations
        shell: bash
        id: make-migrations
        if: inputs.migrate_self == 'true' && inputs.migrate_self_before == 'last'
        env:
          DB_PORT: ${{ inputs.db_port }}
          DB_NAME: ${{ inputs.db_name }}
          DB_USER: ${{ inputs.db_user }}
          DB_PASSWORD: ${{ inputs.db_password }}
          DB_MIGRATIONS_PATH: ${{ inputs.db_migrations_path }}
          DB_MIGRATIONS_CONFIG_PATH: ${{ inputs.db_migrations_config_path }}
        run: |
          flyway migrate -url=jdbc:postgresql://localhost:$DB_PORT/$DB_NAME \
            -user=$DB_USER \
            -password=$DB_PASSWORD \
            -locations=$DB_MIGRATIONS_PATH \
            -configFiles=$DB_MIGRATIONS_CONFIG_PATH
